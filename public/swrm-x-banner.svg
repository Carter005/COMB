<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title description">
  <title id="title">SWRM X header</title>
  <desc id="description">A black and off-white terminal-style text banner reading SWRM, eight scouts one memory, evidence before action, and Solana Mainnet Pump.fun.</desc>
  <rect width="1500" height="500" fill="#050606"/>
  <g fill="#f1f1ed" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">
    <text x="750" y="99" font-size="16" font-weight="700" letter-spacing="0">EIGHT SCOUTS / SOLANA MAINNET</text>
    <text x="750" y="293" font-family="Arial, Helvetica, sans-serif" font-size="188" font-weight="800" letter-spacing="0">SWRM</text>
    <text x="750" y="350" font-size="35" font-weight="700" letter-spacing="0">EIGHT SCOUTS / ONE MEMORY</text>
    <text x="750" y="395" font-size="16" font-weight="700" letter-spacing="0">EVIDENCE BEFORE ACTION</text>
    <text x="750" y="447" font-size="15" font-weight="700" letter-spacing="0">PUMP.FUN / VERIFIED SIGNALS ONLY</text>
  </g>
</svg>
